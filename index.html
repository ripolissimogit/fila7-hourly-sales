<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fila7 · Venduto orario</title>
  <style>
    :root { color-scheme: dark; --bg:#111817; --panel:#18211f; --text:#edf5f0; --muted:#a5b2aa; --grid:#33413d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:1280px; margin:auto; padding:28px; }
    .chart { padding:20px 12px 10px; overflow-x:auto; background:var(--panel); border:1px solid #2d3a35; border-radius:14px; }
    svg { display:block; width:100%; min-width:760px; height:auto; }
    .axis { stroke:#708078; stroke-width:1.2; }
    .axis-title,.axis-value,.bar-label { fill:var(--muted); font-weight:650; }
    .axis-title { font-size:15px; }
    .axis-value { font-size:13px; text-anchor:end; }
    .bar-value { fill:var(--text); font-size:15px; font-weight:760; text-anchor:middle; }
    .bar-label { font-size:13px; text-anchor:middle; }
    @media (max-width:720px) { main { padding:16px; } }
  </style>
</head>
<body>
  <main aria-label="Grafico del venduto orario">
    <section class="chart">
      <svg viewBox="0 0 1200 680" role="img" aria-label="Grafico a barre verticali della variazione netta di posti venduti nell’ultima ora">
        <text x="72" y="26" class="axis-title">variazione netta di posti venduti nell’ultima ora</text>
        <line x1="72" y1="520" x2="1166" y2="520" class="axis"/>
        <text x="58" y="525" class="axis-value">0</text>
        <g class="bar-group"><rect class="bar" x="97" y="518" width="58" height="4" fill="#67747a" rx="5"/><text x="126" y="506" class="bar-value">n/d</text><text x="126" y="550" class="bar-label">Spider-Man</text><text x="126" y="567" class="bar-label">Brand New Day</text></g>
        <g class="bar-group"><rect class="bar" x="207" y="518" width="58" height="4" fill="#67747a" rx="5"/><text x="236" y="506" class="bar-value">n/d</text><text x="236" y="550" class="bar-label">Odissea</text></g>
        <g class="bar-group"><rect class="bar" x="317" y="518" width="58" height="4" fill="#67747a" rx="5"/><text x="346" y="506" class="bar-value">n/d</text><text x="346" y="550" class="bar-label">Hokum</text></g>
        <g class="bar-group"><rect class="bar" x="427" y="518" width="58" height="4" fill="#67747a" rx="5"/><text x="456" y="506" class="bar-value">n/d</text><text x="456" y="550" class="bar-label">Minions &amp;</text><text x="456" y="567" class="bar-label">Monsters</text></g>
        <g class="bar-group"><rect class="bar" x="537" y="518" width="58" height="4" fill="#67747a" rx="5"/><text x="566" y="506" class="bar-value">n/d</text><text x="566" y="550" class="bar-label">Toy Story 5</text></g>
        <g class="bar-group"><rect class="bar" x="647" y="518" width="58" height="4" fill="#67747a" rx="5"/><text x="676" y="506" class="bar-value">n/d</text><text x="676" y="550" class="bar-label">Le città di</text><text x="676" y="567" class="bar-label">pianura</text></g>
        <g class="bar-group"><rect class="bar" x="757" y="518" width="58" height="4" fill="#67747a" rx="5"/><text x="786" y="506" class="bar-value">n/d</text><text x="786" y="550" class="bar-label">Michael</text></g>
        <g class="bar-group"><rect class="bar" x="867" y="518" width="58" height="4" fill="#67747a" rx="5"/><text x="896" y="506" class="bar-value">n/d</text><text x="896" y="550" class="bar-label">Deep Water</text><text x="896" y="567" class="bar-label">Incubo dagli abissi</text></g>
        <g class="bar-group"><rect class="bar" x="977" y="518" width="58" height="4" fill="#67747a" rx="5"/><text x="1006" y="506" class="bar-value">n/d</text><text x="1006" y="550" class="bar-label">Sentimental</text><text x="1006" y="567" class="bar-label">Value</text></g>
        <g class="bar-group"><rect class="bar" x="1087" y="518" width="58" height="4" fill="#67747a" rx="5"/><text x="1116" y="506" class="bar-value">n/d</text><text x="1116" y="550" class="bar-label">Il diavolo</text><text x="1116" y="567" class="bar-label">veste Prada 2</text></g>
      </svg>
    </section>
  </main>
</body>
</html>
