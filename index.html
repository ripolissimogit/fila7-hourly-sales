<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fila7 · Venduto orario</title>
  <style>
    :root { color-scheme: dark; --bg:#111817; --panel:#18211f; --text:#edf5f0; --muted:#a5b2aa; --grid:#33413d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width:1280px; margin:auto; padding:28px; }
    .chart { padding:20px 12px 10px; overflow-x:auto; background:var(--panel); border:1px solid #2d3a35; border-radius:14px; }
    svg { display:block; width:100%; min-width:760px; height:auto; }
    .grid { stroke:var(--grid); stroke-width:1; }
    .axis { stroke:#708078; stroke-width:1.2; }
    .axis-title { fill:var(--muted); font-size:15px; font-weight:650; }
    .axis-value { fill:var(--muted); font-size:13px; text-anchor:end; }
    .bar-value { fill:var(--text); font-size:15px; font-weight:760; text-anchor:middle; }
    .bar-label { fill:var(--muted); font-size:13px; font-weight:650; text-anchor:middle; }
    @media (max-width:720px) { main { padding:16px; } }
  </style>
</head>
<body>
  <main aria-label="Grafico del venduto orario">

 class="bar-value">+2</text><text x="564.3" y="550" class="bar-label">Toy Story 5</text></g><g class="bar-group"><title>Le città di pianura: +177 posti venduti netti nell’ultima ora</title><rect class="bar" x="642.0" y="479.5" width="63.5" height="40.5" fill="#8de03d" rx="5"/><text x="673.7" y="467.5" class="bar-value">+177</text><text x="673.7" y="550" class="bar-label">Le città di</text><text x="673.7" y="567" class="bar-label">pianura</text></g><g class="bar-group"><title>Michael: +21 posti venduti netti nell’ultima ora</title><rect class="bar" x="751.4" y="515.2" width="63.5" height="4.8" fill="#8de03d" rx="5"/><text x="783.1" y="503.2" class="bar-value">+21</text><text x="783.1" y="550" class="bar-label">Michael</text></g><g class="bar-group"><title>Deep Water – Incubo dagli abissi: 0 posti venduti netti nell’ultima ora</title><rect class="bar" x="860.8" y="520.0" width="63.5" height="0.0" fill="#8de03d" rx="5"/><text x="892.5" y="508.0" class="bar-value">0</text><text x="892.5" y="550" class="bar-label">Deep Water –</text><text x="892.5" y="567" class="bar-label">Incubo dagli</text><text x="892.5" y="584" class="bar-label">abissi</text></g><g class="bar-group"><title>Sentimental Value: 0 posti venduti netti nell’ultima ora</title><rect class="bar" x="970.2" y="520.0" width="63.5" height="0.0" fill="#8de03d" rx="5"/><text x="1001.9" y="508.0" class="bar-value">0</text><text x="1001.9" y="550" class="bar-label">Sentimental</text><text x="1001.9" y="567" class="bar-label">Value</text></g><g class="bar-group"><title>Il diavolo veste Prada 2: +16 posti venduti netti nell’ultima ora</title><rect class="bar" x="1079.6" y="516.3" width="63.5" height="3.7" fill="#8de03d" rx="5"/><text x="1111.3" y="504.3" class="bar-value">+16</text><text x="1111.3" y="550" class="bar-label">Il diavolo</text><text x="1111.3" y="567" class="bar-label">veste Prada 2</text></g></svg></section>
  </main>
</body>
</html>
